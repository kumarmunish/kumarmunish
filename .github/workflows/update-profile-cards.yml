name: Update Profile Cards

# The public https://github-readme-stats.vercel.app and
# https://github-readme-activity-graph.vercel.app instances used to render the
# GitHub Stats and Activity Graph cards in README.md are currently down
# upstream (see anuraghazra/github-readme-stats#4858 and
# Ashutosh00710/github-readme-activity-graph#264), which is why those images
# were showing up broken. This workflow generates the cards ourselves via
# GitHub Actions and commits them to the repository so README.md no longer
# depends on those third-party services being available.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true"
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "theme=tokyo-night&hide_border=true"
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/activity-graph.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile stat cards"
          git push
